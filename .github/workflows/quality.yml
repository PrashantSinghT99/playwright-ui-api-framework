name: Quality Engineering CI

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      browser:
        description: Browser used by the UI job
        required: true
        default: chromium
        type: choice
        options: [chromium, firefox, webkit]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  TEST_BASE_URL: ${{ vars.TEST_BASE_URL || 'https://automationintesting.online' }}
  TEST_ADMIN_USERNAME: ${{ secrets.TEST_ADMIN_USERNAME || 'admin' }}
  TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD || 'password' }}

jobs:
  quality:
    name: Python ${{ matrix.python }} quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src
      - name: Unit tests
        run: >-
          pytest -m unit
          --cov=quality_framework
          --cov-report=term-missing
          --cov-report=xml:reports/coverage.xml
          --junitxml=reports/unit.xml
      - name: Publish unit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-python-${{ matrix.python }}
          path: reports/
          if-no-files-found: ignore

  api:
    name: API and contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: API suite
        run: >-
          pytest -m api -n auto
          --html=reports/api.html --self-contained-html
          --junitxml=reports/api.xml
      - name: Publish API results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-results
          path: |
            reports/
            test-results/
          if-no-files-found: ignore

  ui:
    name: UI smoke (${{ inputs.browser || 'chromium' }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m playwright install --with-deps ${{ inputs.browser || 'chromium' }}
      - name: Browser smoke
        run: >-
          pytest -m "ui and smoke"
          --browser ${{ inputs.browser || 'chromium' }}
          --html=reports/ui.html --self-contained-html
          --junitxml=reports/ui.xml
      - name: Publish Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-${{ inputs.browser || 'chromium' }}-results
          path: |
            reports/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
